<svg xmlns="http://w3.org" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://googleapis.com');
      
      .text-container {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 38px;
        font-weight: 700;
        fill: #e11d2e;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .line {
        opacity: 0;
        white-space: nowrap;
        display: inline-block;
      }

      /* Cursor blinking animation */
      @keyframes blink {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }

      /* Step-by-step typing animation for Line 1 */
      @keyframes type1 {
        0% { width: 0; opacity: 1; }
        40% { width: 18ch; opacity: 1; }  /* 'love us, together,' has 18 chars */
        45% { width: 18ch; opacity: 1; }  /* Hold */
        50% { width: 0; opacity: 1; }     /* Delete */
        51%, 100% { width: 0; opacity: 0; } /* Hide during line 2 */
      }

      /* Step-by-step typing animation for Line 2 */
      @keyframes type2 {
        0%, 50% { width: 0; opacity: 0; }  /* Hide during line 1 */
        51% { width: 0; opacity: 1; }
        90% { width: 20ch; opacity: 1; }  /* 'an eater, i need her' has 20 chars */
        95% { width: 20ch; opacity: 1; }  /* Hold */
        100% { width: 0; opacity: 1; }    /* Delete */
      }

      .l1 {
        animation: type1 8s steps(40) infinite;
        overflow: hidden;
      }

      .l2 {
        animation: type2 8s steps(40) infinite;
        overflow: hidden;
      }

      .cursor {
        animation: blink 1s infinite;
      }
    </style>
  </defs>

  <!-- Background matches GitHub light mode or stays white -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <g class="text-container" transform="translate(400, 100)">
    <!-- Line 1 Wrapper -->
    <svg class="l1" x="-250" y="-25" width="500" height="50">
      <text x="50%" y="50%">love us, together,</text>
    </svg>
    
    <!-- Line 2 Wrapper -->
    <svg class="l2" x="-250" y="-25" width="500" height="50">
      <text x="50%" y="50%">an eater, i need her</text>
    </svg>
  </g>
</svg>
